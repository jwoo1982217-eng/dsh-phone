<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机工作区</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18243b;font:15px/1.6 system-ui}main{max-width:760px;padding:20px 16px 40px;margin:auto}h1{margin:0;font-size:27px}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}a{color:#2563eb}.muted,small{font-size:13px;color:#66748a}.card{padding:18px;margin:16px 0;background:#fff;border:1px solid #e2e8f0;border-radius:18px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,input,textarea,select{font:inherit;min-width:0}button{min-height:46px;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#18243b;cursor:pointer}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.45}input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-top:6px;background:#fff}textarea{font:13px/1.6 ui-monospace,monospace;min-height:320px;resize:vertical;tab-size:2}label{display:block;font-weight:550;margin-top:12px}#files{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}#files button{text-align:left;overflow-wrap:anywhere}#notice{padding:12px;border-radius:12px;background:#eaf2ff;color:#1e40af;white-space:pre-wrap}#notice.error{background:#fff3e7;color:#a34b0b}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#f1f5f9;border-radius:12px;font:13px/1.6 ui-monospace,monospace}small{display:block}[hidden]{display:none!important}.file{border:1px dashed #a7baff;padding:12px;border-radius:10px}.file input{padding:0;border:0}#dirty{min-height:22px;color:#9a6700;font-size:13px}</style></head><body><main>
<header><h1>手机工作区</h1><p class="muted">查看机器人做的工作，也可以自己编辑和运行代码。</p><p><a href="/phone-bot">← 机器人</a>　<a href="/phone-skills">技能管理</a></p></header>
<p id="notice" role="status" hidden></p>
<section class="card"><h2>文件</h2><div id="files">正在读取…</div><div class="actions"><button id="refresh">刷新文件</button><button id="new">新建文本文件</button><button id="example">创建 Node.js 示例</button></div><p id="listHint" class="muted"></p><label class="file">导入代码或文本文件<input id="file" type="file" accept=".js,.mjs,.cjs,.sh,.md,.txt,.json,.py,.ts,.html,.css,text/*,application/json"></label><small>导入后先在下方检查、保存。附属脚本和资料放在这里，技能可引用工作区中的相对路径。</small></section>
<section class="card"><h2>编辑文件</h2><label for="path">工作区内的文件名<input id="path" placeholder="例如 scripts/report.mjs" spellcheck="false"></label><div class="actions"><button id="open">读取文件</button></div><label for="text">文件内容<textarea id="text" spellcheck="false" placeholder="先选择文件，或新建文件"></textarea></label><p id="dirty" role="status"></p><div class="actions"><button id="save" class="primary" disabled>保存文件</button><button id="check" disabled>检查 JS 语法</button></div><p class="muted">机器人和编辑器使用同一个工作区。文件在其他地方修改后，需要重新读取并合并。</p></section>
<section class="card"><h2>运行与结果</h2><p class="muted">点击运行会在这台手机执行已保存的脚本，可读写应用文件、访问网络。先确认代码内容。一次最多运行 30 秒。</p><div class="actions"><button id="runNode" disabled>运行 Node.js</button><button id="runBash" disabled>运行 Bash</button></div><pre id="output" role="status">结果会显示在这里。</pre><small>已提供 Node.js 和 Bash。Git、Python、编译器等需要另行安装对应环境；电脑程序不会因导入技能就自动变成手机程序。</small></section>
</main><script>
const $=id=>document.getElementById(id);let current=null,busy=false,dirty=false;
async function call(action,extra={}){const r=await fetch('/phone-import/manage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'client-request',rpcId:crypto.randomUUID(),method:'manage',payload:{action,...extra}})});if(!r.ok)throw Error('工作区服务连接失败，请确认顶部显示运行中');const v=(await r.json()).result;if(!v?.ok)throw Error(v?.error?.message||'操作失败');return v.value;}
function notice(text,error=false){$('notice').hidden=false;$('notice').textContent=text;$('notice').className=error?'error':'';}
function controls(){const ready=current&&!dirty&&current.exists;for(const id of ['refresh','new','example','file','open'])$(id).disabled=busy;$('save').disabled=busy||!current;$('check').disabled=busy||!ready||! /\.(js|mjs|cjs)$/.test(current?.path||'');$('runNode').disabled=$('check').disabled;$('runBash').disabled=busy||!ready||! /\.sh$/.test(current?.path||'');$('dirty').textContent=dirty?'有未保存的修改；保存后才能运行':'';}
async function task(fn){if(busy)return;busy=true;controls();try{await fn();}catch(e){notice(e.message,true);}finally{busy=false;controls();}}
function show(v){current=v;$('path').value=v.path;$('text').value=v.text;dirty=false;controls();}
async function list(){const v=await call('workspace.list');$('files').replaceChildren();if(!v.files.length)$('files').textContent='工作区里还没有文件。';for(const path of v.files){const b=document.createElement('button');b.textContent=path;b.onclick=()=>task(async()=>{if(dirty)throw Error('请先保存当前修改，再切换文件');show(await call('workspace.read',{path}));});$('files').append(b);}$('listHint').textContent=v.truncated?'显示前 200 个文件和 4 层目录；可输入相对路径读取其他文件。':'这些文件只存放在本机机器人工作区。';}
for(const id of ['path','text'])$(id).oninput=()=>{dirty=true;controls();};
$('refresh').onclick=()=>task(list);$('open').onclick=()=>task(async()=>{if(dirty&&current?.exists)throw Error('有未保存修改，请先保存，或刷新页面放弃草稿');show(await call('workspace.read',{path:$('path').value}));notice(current.exists?'文件已读取。':'这个文件还不存在，填写内容后保存即可创建。');});
$('new').onclick=()=>task(async()=>{if(dirty)throw Error('请先保存当前修改');show({path:'notes/new.txt',text:'',revision:null,exists:false});dirty=true;});
$('example').onclick=()=>task(async()=>{if(dirty)throw Error('请先保存当前修改');show({path:'scripts/hello-'+Date.now()+'.mjs',text:"import { writeFile } from 'node:fs/promises';\nconst message = '你好，代码正在这台手机运行。';\nawait writeFile('result.txt', message + '\\n');\nconsole.log(message);\nconsole.log('已生成 result.txt');\n",revision:null,exists:false});dirty=true;notice('示例会写入 result.txt，先保存，再运行。');});
$('file').onchange=()=>task(async()=>{if(dirty)throw Error('请先保存当前修改');const f=$('file').files[0];if(!f)return;if(f.size>524288)throw Error('文本文件最多 512 KB');const text=new TextDecoder('utf-8',{fatal:true}).decode(await f.arrayBuffer());if(text.includes('\0'))throw Error('不能导入二进制文件');const path=f.name;if(/[\\/]/.test(path))throw Error('文件名不正确');const existing=await call('workspace.read',{path});show({...existing,text});dirty=true;notice(existing.exists?'同名文件已存在，保存将更新它，请先检查内容。':'内容已导入草稿，点击保存后才写入工作区。');});
$('save').onclick=()=>task(async()=>{const path=$('path').value;if(path!==current.path){const v=await call('workspace.read',{path});if(v.exists)throw Error('新文件名已存在，请先读取该文件，避免覆盖');current={...current,path,revision:null,exists:false};}show(await call('workspace.save',{path,text:$('text').value,revision:current.revision}));await list();notice('文件已保存到手机工作区。');});
async function run(mode){if(!current||dirty)throw Error('先保存当前文件');$('output').textContent='正在手机执行…';const v=await call('workspace.run',{path:current.path,revision:current.revision,mode});$('output').textContent=v.output.map(x=>x.text).join('')+(v.reason==='timeout'?'\n已达到 30 秒上限，脚本已停止。':v.reason==='output-limit'?'\n输出超过 128 KB，脚本已停止。':'\n退出码：'+v.code);await list();}
$('check').onclick=()=>task(()=>run('check'));$('runNode').onclick=()=>task(()=>run('node'));$('runBash').onclick=()=>task(()=>run('bash'));task(list);
</script></body></html>
