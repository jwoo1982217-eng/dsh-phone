packages:
  - .
nodeLinker: hoisted
# 手机部署树：全 hoisted 实体目录（无符号链接，assets 解压即用）。
# ① SDK 精确锁定 alpha.1，适配器使用新的 ToolCallId。
# ② koffi/node-pty/sharp 用万能桩（Android/Bionic 无原生变体）。
overrides:
  http-cache-semantics: 4.2.0
  '@deepseek-ai/dsh-llm': 0.2.1-alpha.1
  '@deepseek-ai/dsh-credentials': 0.2.1-alpha.1
  '@deepseek-ai/dsh-commands': 0.2.1-alpha.1
  'koffi': file:./stubs/koffi
  'node-pty': file:./stubs/node-pty
  'sharp': file:./stubs/sharp
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  protobufjs: true

