<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查记忆与跨设备传递</title>
<style>:root{color-scheme:light dark;font:15px system-ui}body{margin:0;background:Canvas;color:CanvasText}main{max-width:880px;margin:auto;padding:16px}h1{font-size:22px}h2{font-size:18px}section{border:1px solid #8894a950;border-radius:14px;padding:16px;margin:14px 0}button,input,textarea,select{font:inherit;padding:10px;border:1px solid #8894a970;border-radius:8px;background:Canvas;color:CanvasText;box-sizing:border-box}button{cursor:pointer;background:#2563eb;color:white;margin:5px 5px 5px 0;border:0}button.secondary{background:#64748b20;color:CanvasText}button:disabled{opacity:.5;cursor:default}input[type=text],textarea,select{width:100%;margin:6px 0}input[type=checkbox]{width:auto}label{display:block;margin:5px 0}textarea{min-height:80px;overflow-wrap:anywhere}small,.muted{opacity:.7;line-height:1.65}#notice{white-space:pre-wrap;position:sticky;top:0;background:Canvas;padding:8px 0;z-index:2}#notice:empty{display:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.card{padding:10px 0;border-bottom:1px solid #8894a930}.card p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere}#catalog{max-height:420px;overflow:auto}#preview{border:1px solid #2563eb;padding:12px;border-radius:10px}a{color:#3b82f6}[hidden]{display:none!important}</style>
<style>.card{min-width:0}.card small{display:block;overflow-wrap:anywhere;word-break:break-word}</style>
<main><h1 id="heading">查记忆与跨设备传递</h1><p id="notice" role="status" aria-live="polite"></p>
<section id="memory-section"><h2>查记忆</h2><p class="muted" id="memory-status">读取本机索引…</p><label>问题或关键词<input type="text" id="query" placeholder="例如：上次技能同步怎么处理同名冲突" maxlength="2000"></label><label><input type="checkbox" id="lexical">按关键词查找</label><button id="search">查记忆</button><button id="update" class="secondary">更新索引</button><p id="index-progress" class="muted"></p><details><summary>收录范围</summary><pre id="sources"></pre></details><div id="results"></div></section>
<section id="devices-section"><h2>技能与经验传递</h2><p class="muted">手动选择设备和内容。接收后预览导入；经验在接收端作为待验证候选。两端 DSH 需保持运行，当前支持同一局域网，安卓设备之间也可直连。</p><label>本机名称<input id="name" type="text" maxlength="60"></label><button id="rename" class="secondary">保存名称</button><div id="computer" hidden><label>本机局域网地址<select id="address"></select></label><button id="invite">生成连接链接</button><div id="invitation" hidden><label>在目标设备粘贴此链接（15分钟内有效）<textarea id="link-output" readonly></textarea></label><button id="copy" class="secondary">复制链接</button></div></div><div id="mobile" hidden><label>另一台设备生成的连接链接<textarea id="link-input" autocomplete="off" spellcheck="false"></textarea></label><button id="pair">连接设备</button></div><div id="devices"></div></section>
<section id="send-section"><h2>选择并发送</h2><label>目标设备<select id="target"></select></label><div class="row"><input type="text" id="filter" placeholder="筛选技能或经验"><select id="kind"><option value="">技能和经验</option><option value="skill">技能</option><option value="experience">经验</option></select></div><button id="catalog-refresh" class="secondary">刷新可发送内容</button><p id="selection" class="muted">尚未选择</p><div id="catalog"></div><button id="send">发送所选内容</button><div id="jobs"></div></section>
<section id="receive-section"><h2>接收到的内容</h2><div id="inbox"></div><div id="preview" hidden></div></section><p class="muted">技能文件按校验值完整传递，导入不会执行脚本。同名项可保留本机版本，或带备份替换。源端的批准状态保留为来源记录，接收端需结合本机任务重新验证。</p></main><script src="/knowledge-link/page.js"></script></html>
