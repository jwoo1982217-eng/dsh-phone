<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子代理调度</title><link rel="stylesheet" href="/subagent-scheduler/page.css"><body>
<h1>子代理调度</h1><p>主模型理解工作内容后，选择子代理使用的模型/API。这里设置候选范围和并发，不需要每次手动派模型。</p>
<p id="message" role="status" aria-live="polite"></p><form id="settings"><div class="master"><label class="toggle"><input id="delegationEnabled" type="checkbox">允许子代理协作（总开关）</label><p>关闭后主模型独立完成工作，不再新建或派发子代理任务；已接收的任务继续完成。</p></div><label class="toggle"><input id="enabled" type="checkbox">启用请求排队与限流冷却</label>
<div class="limits"><label>总并发<input id="maxConcurrent" type="number" min="1" max="8" required></label><label>每额度组并发<input id="providerConcurrency" type="number" min="1" max="8" required></label><label>每模型并发<input id="modelConcurrency" type="number" min="1" max="8" required></label><label>额度组请求间隔（毫秒）<input id="minIntervalMs" type="number" min="0" max="60000" required></label><label>限流冷却（毫秒）<input id="cooldownMs" type="number" min="1000" max="300000" required></label></div>
<h2>添加模型/API</h2><p>按供应商展开选择，包含你自己配置的 API。可搜索模型或供应商；目录可见不代表账户余额、权限或模型能力已经验证。</p><div class="catalog-tools"><label for="search">搜索模型或供应商<input id="search" type="search" placeholder="模型名称、API 来源"></label><label for="provider-jump">快速跳转供应商<select id="provider-jump" aria-label="快速跳转供应商"><option value="">选择供应商…</option></select></label><button id="catalog-refresh" type="button">刷新模型目录</button><button id="collapse" type="button">全部收起</button></div><p id="catalog-status" class="hint"></p><div id="catalog" role="region" aria-label="按供应商分组的模型目录" tabindex="0"></div>
<h2>已选候选 <span id="selected-count"></span></h2><p>工作类型是主模型选路的偏好。同一账号共用限额的接口，请填写相同额度组。</p><div id="routes"></div>
<div class="savebar"><button type="submit">保存设置</button><button id="refresh" type="button">刷新运行状态</button><button id="reload" type="button">重新载入设置</button></div></form><h2>运行状态</h2><p id="runtime"></p><div id="cooldowns"></div><p class="hint">保存新线路时，仅将你选中的模型加入原生允许列表。新增授权供新聊天使用；已有聊天保留原模型授权。并发控制覆盖同一来源的主模型请求，失败请求不自动重放。</p><script src="/subagent-scheduler/page.js"></script></body></html>
