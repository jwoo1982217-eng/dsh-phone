<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆隔离与排查</title>
<style>body{font:15px system-ui;max-width:900px;margin:0 auto;padding:16px;color:CanvasText;background:Canvas;color-scheme:light dark}h1{font-size:21px}h2{font-size:17px}button,select{font:inherit;padding:9px;margin:4px;border:1px solid #8886;border-radius:8px;background:Canvas;color:CanvasText}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.box{border:1px solid #8885;border-radius:12px;padding:12px;margin:12px 0}p{line-height:1.6;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px system-ui}.bad{color:#d74b56}.good{color:#39a77b}select{max-width:100%}.row{display:flex;flex-wrap:wrap;gap:4px}#message{min-height:24px}small{opacity:.8}</style>
<h1>记忆隔离与排查</h1><p>发现异常时，先暂停学习与召回，再查看来源并隔离对应窗口。当前聊天中的旧内容仍在上下文里，排查后请开启新窗口。</p>
<div class="row"><button id="refresh">刷新检查</button><button id="freeze">暂停全部学习与召回</button><button id="resume">恢复窗口经验学习</button></div><p id="message" role="status"></p><div id="summary" class="box"></div>
<div class="box"><h2>主卡与副卡</h2><p id="persona"></p><button id="restore">恢复已确认的人设</button><button id="confirm">确认当前人设为新基线</button><small>仅在人设符合你的要求时确认新基线。</small></div>
<div class="box"><h2>项目与窗口经验</h2><p>不同项目、不同窗口分别存储。候选通过证据验证后才在本窗口生效，不自动转成全局规则。</p><select id="window"><option>暂无经验记录</option></select><div class="row"><button id="detail">查看来源与生效链路</button><button id="quarantine">隔离所选窗口</button><button id="unquarantine">解除所选窗口隔离</button><button id="export">导出当前排查记录</button></div><div id="records"></div></div>
<div class="box"><h2>历史来源调查</h2><div id="sources"></div></div><small id="limits"></small><script src="/memory-isolation/page.js"></script></html>
