<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务监督与经验</title>
<style>body{font:15px system-ui;color:CanvasText;background:Canvas;color-scheme:light dark;max-width:980px;margin:auto;padding:16px}h1{font-size:22px}h2{font-size:17px}p{line-height:1.6}button,select,input{font:inherit}button,select{padding:9px;border:1px solid #8886;border-radius:8px;background:Canvas;color:CanvasText}button:disabled{opacity:.5}label{display:block;padding:8px 0}.card{padding:14px;border:1px solid #8885;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:8px}.badge{border-radius:7px;padding:4px 8px;background:#8882;display:inline-block;margin:4px}.error{color:#d74b56}pre{white-space:pre-wrap;font:13px system-ui}small{opacity:.8}#message{min-height:24px}</style>
<h1>任务监督与经验</h1><p>复杂任务自动拆分、子代理协作、主代理验收。任务结束后复盘，实际证据通过才保存方法，同项目的新任务自动召回。人格接续保存有来源的身份、偏好与关系陈述；蜂巢事实账本记录依据、领取和结算。</p>
<div class="card"><h2>运行设置</h2><label><input type="checkbox" id="learning"> 允许项目经验持久保存与自动复盘</label><label><input type="checkbox" id="swarm"> 复杂任务自动蜂巢协作</label><label><input type="checkbox" id="projectRecall"> 同项目跨聊天召回已验证方法</label><label><input type="checkbox" id="continuity"> 保存当前项目的人格接续与用户原话</label><small>人格按主卡隔离，切换模型继续接续。共享 Noema 保持自己的开关。暂停“记忆隔离”时，这里的保存、召回和派单也暂停。自动子代理负责分析与检查，主代理负责修改、外部操作与最终交付。</small><div class="row"><button id="save">保存设置</button><button id="refresh">刷新状态</button></div><p id="summary"></p></div>
<p id="message" role="status"></p><div class="row"><select id="filter"><option value="all">全部任务</option><option value="pending">等待处理</option><option value="saved">经验已保存</option></select></div><div id="tasks"></div>
<small>“本轮结束”是运行事件；实际任务结果以验收依据为准。“待验证”表示候选还未生效。可以查看阶段、子代理、证据来源与失败原因。</small><script src="/task-supervisor/page.js"></script></html>
