# Existing HTTPS vhost, valid domain/certificate required.
server {
    listen 443 ssl;
    server_name tools.example.com;
    ssl_certificate /etc/letsencrypt/live/tools.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.example.com/privkey.pem;
    location = /relay {
        proxy_pass http://127.0.0.1:8789/relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        client_max_body_size 1m;
    }
    location = /health { proxy_pass http://127.0.0.1:8789/health; }
    location / { return 404; }
}
