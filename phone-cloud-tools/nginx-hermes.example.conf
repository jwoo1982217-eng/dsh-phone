# Merge into an existing HTTPS vhost after setting the domain and certificate.
# Hermes remains loopback-only; the API checks its own API_SERVER_KEY.
server {
    listen 443 ssl;
    server_name hermes.example.com;
    ssl_certificate /etc/letsencrypt/live/hermes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermes.example.com/privkey.pem;
    location /v1/ {
        proxy_pass http://127.0.0.1:8642;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }
    # For gateway.multiplex_profiles, expose only your intended profile prefix.
    # location /p/my-profile/v1/ { proxy_pass http://127.0.0.1:8642; ... }
    location / { return 404; }
}
