<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程 Hermes</title><link rel="stylesheet" href="/hermes-remote/page.css"></head><body><main>
<header><h1>远程 Hermes</h1><p>连接自己部署的 Hermes，模型由服务器配置。</p><nav><a href="/">手机本机</a><a href="/phone-tools">手机工具授权</a></nav></header>
<p id="notice" role="status"></p>
<section><h2>服务器连接</h2><p id="connection"></p><label>连接名称<input id="name" maxlength="60" placeholder="我的 Hermes"></label><label>Hermes API 地址<input id="server" type="url" placeholder="https://你的服务器域名" autocomplete="off"></label><label>连接密钥<input id="key" type="password" placeholder="服务器的 API_SERVER_KEY" autocomplete="new-password"></label><p class="hint">连接密钥用于访问 Hermes；模型 API Key 在服务器上配置。密钥留空会保留当前地址的已有密钥。</p><div class="actions"><button id="save">保存连接</button><button id="check">检查连接</button><button id="disconnect">移除连接</button></div></section>
<section><h2>Hermes 对话</h2><div class="actions"><button id="create">新建对话</button><button id="refresh">刷新任务</button><button id="stop">停止任务</button></div><label>选择对话<select id="conversations"><option value="">先新建对话</option></select></label><p id="run-state"></p><div id="approval" hidden><p>服务器请求确认。核对下面内容，只批准这一次。手机工具仍需独立授权。</p><pre id="approval-detail"></pre><div class="actions"><button id="approve-once">批准这一次</button><button id="deny">拒绝</button></div><p class="hint">服务器没有提供具体确认编号时，请在 Hermes 原有入口确认。</p></div><div id="messages" aria-live="polite"></div><div id="recovery" hidden><p>提交结果未知。可用相同请求编号查询原任务，不会主动创建新的编号。</p><button id="recover">恢复原任务编号</button></div><label>发送给服务器 Hermes<textarea id="message" rows="4" maxlength="32768" placeholder="向 Hermes 交代任务…"></textarea></label><button id="send">发送</button><p class="hint">消息交给服务器执行。关闭页面或断网不会自动停止服务器任务。手机操作仍须在「手机工具授权」确认。</p></section>
<dialog id="confirm"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-detail"></p><div class="actions"><button value="cancel">取消</button><button value="ok">确认</button></div></form></dialog>
</main><script src="/hermes-remote/page.js"></script></body></html>
