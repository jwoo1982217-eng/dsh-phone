<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队协作</title><script src="/dsh-team/page.js" defer></script><style>
:root{color-scheme:light dark}body{margin:0;font:15px/1.65 system-ui;background:Canvas;color:CanvasText}main{max-width:720px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 8px}p{margin:10px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button,a{font:inherit;min-height:44px;padding:8px 14px;border:1px solid #8792a8;border-radius:12px;color:inherit;background:transparent;text-decoration:none;box-sizing:border-box}button{cursor:pointer}.primary{background:#476bf5;border-color:#476bf5;color:white}li{margin:8px 0}#notice{color:#6a7690}small{display:block;margin-top:12px}</style></head><body><main><h1>团队协作</h1><p>分别与成员私聊，或在项目群中通过 @ 分配任务。各成员使用自己的模型、角色和记忆。</p><div class="actions"><button id="open-team" class="primary">进入团队</button><button id="open-agent">返回普通聊天</button><a href="/agent-cards">从角色卡创建成员</a></div><p id="notice" role="status">正在读取团队…</p><ul id="members"></ul><p>进入团队后，用左上角“＋”创建成员或项目群，也可以让主理人帮你创建。先给成员选择模型，再交代任务。</p><small>手机电脑模式使用电脑的团队；手机本机模式使用本机团队。</small></main></body></html>
